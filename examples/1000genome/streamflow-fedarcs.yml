# Run translation, compilation, and run.sh on fd-coordinator (ssh fedarcs).
version: v1.0

workflows:
  genome:
    type: cwl
    config:
      file: main.cwl
      settings: config.yml
    bindings:
    - step: /
      target:
        deployment: coordinator

    - step: /chromosome
      target:
      - deployment: chromosome_worker1
      - deployment: chromosome_worker2

    - step: /chromosome/individuals
      target:
      - deployment: inner_worker1
      - deployment: inner_worker2
      - deployment: inner_worker3

    - step: /chromosome/mutation_overlap
      target:
      - deployment: inner_worker1
      - deployment: inner_worker2
      - deployment: inner_worker3

    - step: /chromosome/frequency
      target:
      - deployment: inner_worker1
      - deployment: inner_worker2
      - deployment: inner_worker3

deployments:
  coordinator:
    type: local
    config: {}
    port: 25400

  chromosome_worker1:
    type: ssh
    config:
      nodes: [fd-00]
      username: tfogliobonda
      checkHostKey: accept-new
    workdir: /mnt/shared/tfogliobonda/swirlc-runs/1000genome/chromosome_worker1
    port: 25410

  chromosome_worker2:
    type: ssh
    config:
      nodes: [fd-01]
      username: tfogliobonda
      checkHostKey: accept-new
    workdir: /mnt/shared/tfogliobonda/swirlc-runs/1000genome/chromosome_worker2
    port: 25411

  inner_worker1:
    type: ssh
    config:
      nodes: [fd-02]
      username: tfogliobonda
      checkHostKey: accept-new
    workdir: /mnt/shared/tfogliobonda/swirlc-runs/1000genome/inner_worker1
    port: 25420

  inner_worker2:
    type: ssh
    config:
      nodes: [fd-03]
      username: tfogliobonda
      checkHostKey: accept-new
    workdir: /mnt/shared/tfogliobonda/swirlc-runs/1000genome/inner_worker2
    port: 25421

  inner_worker3:
    type: ssh
    config:
      nodes: [fd-04]
      username: tfogliobonda
      checkHostKey: accept-new
    workdir: /mnt/shared/tfogliobonda/swirlc-runs/1000genome/inner_worker3
    port: 25422
