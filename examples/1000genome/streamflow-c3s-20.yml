# 20 persistent Broadwell location(s); translate/compile on C3S.
# Chromosome and population scatters share a pool; 20 adds 10 interval workers.
version: v1.0
workflows:
  genome:
    type: cwl
    config:
      file: main.cwl
      settings: config.yml
    bindings:
      - step: /
        target:
          deployment: worker01
          service: worker
      - step: /chromosome
        target:
          - deployment: worker01
            service: worker
          - deployment: worker02
            service: worker
          - deployment: worker03
            service: worker
          - deployment: worker04
            service: worker
          - deployment: worker05
            service: worker
          - deployment: worker06
            service: worker
          - deployment: worker07
            service: worker
          - deployment: worker08
            service: worker
          - deployment: worker09
            service: worker
          - deployment: worker10
            service: worker
      - step: /chromosome/individuals
        target:
          - deployment: worker11
            service: worker
          - deployment: worker12
            service: worker
          - deployment: worker13
            service: worker
          - deployment: worker14
            service: worker
          - deployment: worker15
            service: worker
          - deployment: worker16
            service: worker
          - deployment: worker17
            service: worker
          - deployment: worker18
            service: worker
          - deployment: worker19
            service: worker
          - deployment: worker20
            service: worker
deployments:
  worker01:
    type: slurm
    config:
      services:
        worker:
          partition: broadwell
          nodes: 1
          ntasks: 1
          time: 01:00:00
          options:
            cpus_per_task: 8
            mem: 32G
            exclusive: true
    workdir: 
      /beegfs/home/tommaso.fogliobonda/swirlc/runs/1000genome/20-locations/worker01
    port: 27500
    environment:
      PATH: 
        /beegfs/home/tommaso.fogliobonda/swirlc/venv/bin:/usr/local/bin:/usr/bin:/bin
      SWIRLC_PYTHON: /beegfs/home/tommaso.fogliobonda/swirlc/venv/bin/python
      SWIRLC_COMMAND_SLOTS: '0'
