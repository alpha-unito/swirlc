version: v1.0

steps:
  s_sc:
    displayName: "ScatterPairer"
    type: scatter_pairer
    outputs:
      p_id:
        dataName: id_ID
      p_group:
        dataName: group_ID

  s_op:
    displayName: "ScatterOpen"
    type: scatter_open
    outputs:
      p_a:
        dataName: a_ID
        glob: "input_a.txt"
      p_b:
        dataName: b_ID
        glob: "input_b.txt"

  s_work:
    displayName: "ComputeItem"
    command: python3
    arguments:
      - value: "/home/tommo/Coding/Alpha/swirlc/examples/swirl/scatter/scripts/compute.py"
      - value: "--id"
      - valueFrom: p_id
      - value: "-a"
      - valueFrom: p_a
      - value: "-b"
      - valueFrom: p_b
      - value: "-o"
      - value: "result.txt"
    outputs:
      p_res:
        dataName: res_ID
        glob: "result.txt"

  s_G:
    displayName: "ScatterGather"
    type: scatter_gather
    outputs:
      p_out:
        dataName: d_out

  s_post:
    displayName: "AnalyzeReport"
    command: python3
    arguments:
      - value: "/home/tommo/Coding/Alpha/swirlc/examples/swirl/scatter/scripts/analyze.py"
      - value: "-i"
      - valueFrom: p_out
      - value: "-o"
      - value: "analysis_report.txt"
    outputs:
      p_report:
        dataName: d_report
        glob: "analysis_report.txt"

locations:
  l0:
    hostname: 127.0.0.1
    port: 8080
  l1:
    hostname: 127.0.0.1
    port: 8081
  l2:
    hostname: 127.0.0.1
    port: 8082
  l3:
    hostname: 127.0.0.1
    port: 8083

dependencies:
  d_in1:
    type: file
    value: "/home/tommo/Coding/Alpha/swirlc/examples/swirl/scatter/data/ArchiveA.zip"
  d_in2:
    type: file
    value: "/home/tommo/Coding/Alpha/swirlc/examples/swirl/scatter/data/ArchiveB.zip"
  id_ID:
    type: file
  group_ID:
    type: file
  a_ID:
    type: file
  b_ID:
    type: file
  res_ID:
    type: file
  d_out:
    type: list[file]
  d_report:
    type: file
  eof:
    type: string

