#!/usr/bin/env streamflow
version: v1.0
workflows:
  master:
    type: cwl
    config:
      file: main_montage.cwl
      settings: data-intermediate/config_montage.json
      docker:
        - step: /
          deployment:
            type: none
            config: {}
    bindings:
      - step: /
        target:
          deployment: inlocal
database:
  type: sqlite
  config:
    connection: .streamflow/sqlite.db
deployments:
  inlocal:
    type: local
    config: { }
    environment:
      PATH: /home/tommo/Coding/Alpha/swirlc/.venv/bin:/home/tommo/Coding/Alpha/swirlc/.tools/montage/Montage-main/bin:/usr/local/bin:/usr/bin:/bin
