version: v1.0
workflows:
  master:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
    bindings:
    - step: /
      target:
        deployment: coordinator
    - step: /outer
      target:
      - deployment: outer1
      - deployment: outer2
    - step: /outer/middle
      target:
      - deployment: middle1
      - deployment: middle2
    - step: /outer/middle/leaf
      target:
      - deployment: leaf1
      - deployment: leaf2
deployments:
  coordinator:
    type: local
    config: {}
    port: 35500
  outer1:
    type: local
    config: {}
    port: 35501
  outer2:
    type: local
    config: {}
    port: 35502
  middle1:
    type: local
    config: {}
    port: 35503
  middle2:
    type: local
    config: {}
    port: 35504
  leaf1:
    type: local
    config: {}
    port: 35505
  leaf2:
    type: local
    config: {}
    port: 35506
