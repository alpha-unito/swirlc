version: v1.0
workflows:
  toy_genome:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
    bindings:
    - step: /
      target:
        deployment: coordinator
    - step: /chromosome
      target:
      - deployment: chromosome_worker1
      - deployment: chromosome_worker2
    - step: /chromosome/individuals
      target:
      - deployment: inner_worker1
      - deployment: inner_worker2
      - deployment: inner_worker3
    - step: /chromosome/mutation_overlap
      target:
      - deployment: inner_worker1
      - deployment: inner_worker2
      - deployment: inner_worker3
    - step: /chromosome/frequency
      target:
      - deployment: inner_worker1
      - deployment: inner_worker2
      - deployment: inner_worker3
deployments:
  coordinator:
    type: local
    config: {}
    port: 35800
  chromosome_worker1:
    type: local
    config: {}
    port: 35810
  chromosome_worker2:
    type: local
    config: {}
    port: 35811
  inner_worker1:
    type: local
    config: {}
    port: 35820
  inner_worker2:
    type: local
    config: {}
    port: 35821
  inner_worker3:
    type: local
    config: {}
    port: 35822
