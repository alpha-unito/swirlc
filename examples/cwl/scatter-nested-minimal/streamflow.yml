version: v1.0
workflows:
  master:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
    bindings:
      - step: /
        target:
          deployment: coordinator
      - step: /process_batch
        target:
          - deployment: coordinator
          - deployment: worker1
          - deployment: worker2
      - step: /process_batch/echo_item
        target:
          - deployment: worker1

deployments:
  coordinator:
    type: local
    config: {}
    port: 35300
  worker1:
    type: local
    config: {}
    port: 35320
  worker2:
    type: local
    config: {}
    port: 35320