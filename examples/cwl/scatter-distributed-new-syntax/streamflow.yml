version: v1.0
workflows:
  master:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
    bindings:
    - step: /
      target:
        deployment: coordinator
    - step: /left_source
      target:
        deployment: left_producer
    - step: /right_source
      target:
        deployment: right_producer
    - step: /process
      target:
      - deployment: worker1
      - deployment: worker2

      - deployment: coordinator
deployments:
  coordinator:
    type: local
    config: {}
    port: 35080
  worker1:
    type: local
    config: {}
    port: 35081
  worker2:
    type: local
    config: {}
    port: 35082
  left_producer:
    type: local
    config: {}
    port: 35083
  right_producer:
    type: local
    config: {}
    port: 35084
