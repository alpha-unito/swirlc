version: v1.0
workflows:
  scatter:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
    bindings:
      - step: /
        target:
          deployment: source
      - step: /echo_pair
        target:
          deployment: worker
deployments:
  source:
    type: local
    config: {}
    port: 35080
  worker:
    type: local
    config: {}
    port: 35081
