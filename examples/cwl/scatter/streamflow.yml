version: v1.0
workflows:
  master:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
    bindings:
      - step: /
        target:
          deployment: l0
      - step: /compute
        target:
          deployment: workers
          locations: 3
      - step: /analyze
        target:
          deployment: l0

deployments:
  l0:
    type: local
    config: {}
    port: 35080
  workers:
    type: local
    config: {}
    port: 35081
