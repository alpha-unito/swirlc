version: v1.0
workflows:
  master:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
    bindings:
      - step: /
        target:
          deployment: coordinator
      - step: /process_group
        target:
          - deployment: worker1
          - deployment: worker2
      - step: /final_report
        target:
          deployment: coordinator

deployments:
  coordinator:
    type: local
    config: {}
    port: 35100
  worker1:
    type: local
    config: {}
    port: 35110
  worker2:
    type: local
    config: {}
    port: 35111
