version: v1.0
workflows:
  nested:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
    bindings:
      - step: /
        target:
          deployment: source
      - step: /echo_batch
        target:
          deployment: outer
      - step: /echo_batch/echo_item
        target:
          deployment: inner
deployments:
  source:
    type: local
    config: {}
    port: 35100
  outer:
    type: local
    config: {}
    port: 35101
  inner:
    type: local
    config: {}
    port: 35102
