version: v1.0
workflows:
  master:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
      docker:
        # Container wrapping is a StreamFlow runtime concern. The SWIRL
        # translator ignores this block and uses only `bindings` to place steps.
        - step: /
          deployment:
            type: none
            config: {}
    bindings:
      # Keep both workflow steps on SLURM, but use distinct services so SWIRL
      # creates two HPC locations instead of collapsing them into one process.
      - step: /step1
        target:
          deployment: cluster-slurm
          service: broadwell-step1
      - step: /step2
        target:
          deployment: cluster-slurm
          service: broadwell-step2

deployments:
  local:
    type: local
    config: {}

  cluster-login:
    type: ssh
    config:
      nodes:
        - mercurio.hpc4ai.unito.it
      username: tommaso.fogliobonda
      sshKey: ~/.ssh/unito
      checkHostKey: false
    workdir: /beegfs/home/tommaso.fogliobonda/tmp/swirl

  cluster-slurm:
    type: slurm
    wraps: cluster-login
    workdir: /beegfs/home/tommaso.fogliobonda/tmp/swirl
    config:
      maxConcurrentJobs: 4
      services:
        broadwell-step1:
          partition: broadwell
          nodes: 1
          ntasks: 1
          time: "00:10:00"
        broadwell-step2:
          partition: broadwell
          nodes: 1
          ntasks: 1
          time: "00:10:00"
