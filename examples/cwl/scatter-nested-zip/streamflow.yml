version: v1.0
workflows:
  master:
    type: cwl
    config:
      file: main.cwl
      settings: inputs.yml
    bindings:
      - step: /
        target:
          deployment: coordinator
      - step: /process_all_zips
        target:
          - deployment: zip_worker1
          - deployment: zip_worker2
      - step: /process_all_zips/inspect_step
        target:
          - deployment: file_worker1
          - deployment: file_worker2
          - deployment: file_worker3
      - step: /final_summary
        target:
          deployment: coordinator

deployments:
  coordinator:
    type: local
    config: {}
    port: 35200
  zip_worker1:
    type: local
    config: {}
    port: 35210
  zip_worker2:
    type: local
    config: {}
    port: 35211
  file_worker1:
    type: local
    config: {}
    port: 35220
  file_worker2:
    type: local
    config: {}
    port: 35221
  file_worker3:
    type: local
    config: {}
    port: 35222
