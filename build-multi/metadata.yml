version: v1.0
steps:
  s1:
    displayName: chromosome/get_intervals
    command: ''
    arguments: []
    outputs:
      p12:
        dataName: d12
      p13:
        dataName: d13
  s3:
    displayName: chromosome/individuals_merge
    command: ''
    arguments: []
    outputs:
      p15:
        dataName: d15
        glob: "chr$(inputs.chromosome)n.tar.gz"
  s0:
    displayName: chromosome/get_chromosome
    command: ''
    arguments: []
    outputs:
      p11:
        dataName: d11
  s4:
    displayName: chromosome/sifting
    command: ''
    arguments: []
    outputs:
      p16:
        dataName: d16
        glob: "sifted.SIFT.chr$(inputs.chromosome).txt"
  s2:
    displayName: chromosome/individuals
    command: ''
    arguments: []
    outputs:
      p14:
        dataName: d14
        glob: "chr$(inputs.chromosome)n-$(inputs.counter)-$(inputs.stop).tar.gz"
  s5:
    displayName: chromosome/mutation_overlap
    command: ''
    arguments: []
    outputs:
      p17:
        dataName: d17
        glob: "chr$(inputs.chromosome)-$(inputs.population.nameroot).tar.gz"
  s6:
    displayName: chromosome/frequency
    command: ''
    arguments: []
    outputs:
      p18:
        dataName: d18
        glob: "chr$(inputs.chromosome)-$(inputs.population.nameroot)-freq.tar.gz"
locations:
  l0:
    hostname: 127.0.0.1
    port: 35050
  l1:
    hostname: login.hpc.example.org
    port: 35050
    connectionType: ssh
    workdir: /home/tommaso/tmp/streamflow
  l2:
    hostname: login.hpc.example.org
    port: 35050
    connectionType: ssh
    workdir: /beegfs/home/tommaso/tmp/streamflow
  l3:
    hostname: 127.0.0.1
    port: 35050
    workdir: /workdir
dependencies:
  d0:
    type: file
    value: data/20130502/columns.txt
  d1:
    type: file
    value: scripts/cpp-applications/build/frequency
  d2:
    type: file
    value: scripts/cpp-applications/build/individuals
  d3:
    type: file
    value: scripts/cpp-applications/build/individuals_merge
  d4:
    type: file
    value: scripts/cpp-applications/build/mutation_overlap
  d5:
    type: file
    value: "[{'type': 'File', 'path': 'data/populations/AFR'}, {'type': 'File', 'path':
      'data/populations/ALL'}, {'type': 'File', 'path': 'data/populations/AMR'}, {'type':
      'File', 'path': 'data/populations/EAS'}, {'type': 'File', 'path': 'data/populations/EUR'},
      {'type': 'File', 'path': 'data/populations/GBR'}, {'type': 'File', 'path': 'data/populations/SAS'}]"
  d6:
    type: file
    value: "[{'type': 'File', 'path': 'data/20130502/sifting/ALL.chr1.phase3_shapeit2_mvncall_integrated_v5.20130502.sites.annotation.vcf.gz'}]"
  d7:
    type: file
    value: scripts/cpp-applications/build/sifting
  d8:
    type: file
    value: "[{'type': 'File', 'location': 'data/20130502/ALL.chr1.250000.vcf.gz'}]"
  d9:
    type: file
    value: '3125'
  d10:
    type: file
    value: '25000'
  d12:
    type: file
  d13:
    type: file
  d15:
    type: file
  d11:
    type: file
